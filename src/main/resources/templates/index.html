<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dora ChatBot</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-button" id = "new-chat-button">
                <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                New Chat
            </button>
        </div>
        <nav class="chat-history">
            <ul>
                <!-- Placeholder for chat history items -->
                <li class="active"><a href="#">Current Conversation</a></li>
                <li><a href="#">Spring Boot</a></li>
                <li><a href="#">CSS-Info</a></li>
                <li><a href="#">Java</a></li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <a href="https://github.com/michalroziel/DoraChatBot" target="_blank">GitHub</a>
        </div>
    </aside>

    <div class="main-content">
        <header class="app-header">
            <h1>Dora ChatBot</h1>
        </header>

        <main id="chat-container" class="chat-container">
            <div id="message-area" class="message-area">
                <!-- Messages will be appended here -->
            </div>
            <form id="message-form" class="message-form" onsubmit="event.preventDefault(); send();">
                <input type="text" id="message-input" class="message-input" placeholder="Type your message...">
                <button type="submit" id="send-button" class="send-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 11L12 6L17 11M12 18V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </main>

        <footer class="app-footer">
            <p>Version: <span th:text="${version}">unknown</span>, Commit: <span th:text="${buildNumber}">unknown</span></p>
        </footer>
    </div>
</div>
<script th:src="@{/BackendConnection.js}"></script>
</body>
</html>
