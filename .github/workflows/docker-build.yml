name: Build and Push Docker Image

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build Docker image (latest)
        run: docker build --platform linux/amd64 -t ghcr.io/${{ github.repository_owner }}/dorachatbot:latest .

      - name: Build Docker image (latest-pi)
        run: docker build --platform linux/arm64 -t ghcr.io/${{ github.repository_owner }}/dorachatbot:latest-pi .

      - name: Push Docker image (latest)
        run: docker push ghcr.io/${{ github.repository_owner }}/dorachatbot:latest

      - name: Push Docker image (latest-pi)
        run: docker push ghcr.io/${{ github.repository_owner }}/dorachatbot:latest-pi